# The browser terminal should look like Nomad Network itself, not tmux.
set -g status off
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Size the window to whichever browser tab was used most recently.
set -g window-size latest
set -g history-limit 5000
